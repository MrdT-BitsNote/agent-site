# ============================================================
#  agent.worldstip.com —— WorldsTip 旅行规划大师 · 静态展示站 v0.1.25
#  纯静态：无后端、无反代。自托管 Agent 应用不再随站部署
#          （需要就把技能包整包下载到自己的服务器自行部署）
#
#  部署步骤：
#    1. 上传站点：rsync -av agent-site/ root@server:/var/www/worldstip-agent-site/
#       （若目录名不同，改下面 root 那一行）
#    2. sudo cp nginx-agent.worldstip.com.conf /etc/nginx/sites-available/
#    3. sudo ln -s /etc/nginx/sites-available/nginx-agent.worldstip.com.conf \
#                  /etc/nginx/sites-enabled/
#    4. 证书：sudo certbot --nginx -d agent.worldstip.com
#       （certbot 自动写入 ssl_certificate / ssl_certificate_key）
#    5. sudo nginx -t && sudo systemctl reload nginx
#
#  路由约定（全部静态直出）：
#    /                 → 中文展示站 index.html
#    /index-en.html    → 英文展示站（hreflang 互指）
#    /samples/*        → 小册子范本
#    /downloads/*      → 六端技能包（单独配 MIME，避免 .skill 被当文本）
#    /robots.txt /sitemap.xml /og-cover.png → 静态直出
# ============================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name agent.worldstip.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agent.worldstip.com;

    # SSL 证书（certbot 会自动补下面两行；你已有证书则手动填路径）
    # ssl_certificate     /etc/letsencrypt/live/agent.worldstip.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agent.worldstip.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/worldstip-agent-site;
    index index.html;

    # gzip（HTML/CSS/JS/SVG/JSON 压缩，首屏更快）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ── 全站静态直出（无后端）──
    location / {
        try_files $uri $uri/ =404;
    }

    # ── 技能包下载：显式 MIME + 一天缓存 ──
    location /downloads/ {
        types {
            application/zip                zip;
            application/octet-stream       skill;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # 静态资源 7 天缓存（robots/sitemap 不入此正则，避免被缓存）
    location ~* \.(css|js|svg|png|jpe?g|webp|woff2?)$ { expires 7d; }

    # robots.txt / sitemap.xml 短缓存，方便搜索引擎及时取到新版
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
}
